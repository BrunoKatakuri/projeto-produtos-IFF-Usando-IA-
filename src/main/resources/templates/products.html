<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Produtos</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

    <h1>Sistema de Produtos</h1>

    <form
            action="/products"
            method="post"
    >

        <input
                type="text"
                name="name"
                placeholder="Nome"
                required
        >

        <input
                type="number"
                step="0.01"
                name="price"
                placeholder="Preço"
                required
        >

        <textarea
                name="description"
                placeholder="Descrição"
        ></textarea>

        <button type="submit">
            Salvar
        </button>

    </form>

    <hr>

    <div
            th:each="product : ${products}"
            class="product-card"
    >

        <h2 th:text="${product.name}"></h2>

        <p>
            R$
            <span th:text="${product.price}"></span>
        </p>

        <p th:text="${product.description}"></p>

    </div>

</div>

</body>
</html>
